<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="favico.png" />
    <title>Mother Mary｜電影包場</title>
    <meta name="description" content="A meditation in red — the flowing veil of Mother Mary." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="silk" aria-hidden="true"></canvas>

    <!-- Poster layout: CD bleeding off the top-left, big wordmark across
         the lower half, meta top-right, captions bottom-left / bottom-right -->
    <main class="stage">
      <!-- Realistic spinning CD — bleeds off the top-left corner -->
      <div class="cd-stage" aria-hidden="true">
        <div class="cd">
          <div class="cd__spin">
            <!-- Swap this src with your own CD cover artwork -->
            <img class="cd__art" src="/cd-cover.png" alt="" />
            <div class="cd__grooves"></div>
          </div>
          <div class="cd__sheen"></div>
          <div class="cd__clear"></div>
          <div class="cd__hub"></div>
          <div class="cd__hole"></div>
        </div>
      </div>

      <!-- Big "MOTHER MARY" wordmark -->
      <img class="title" src="/mother-mary-logo.svg" alt="Mother Mary" />

      <!-- Bottom captions -->
      <div class="caption-flex">
        <p class="caption">2026-07-18 11:20</p>
        <div class="line"></div>
        <p class="caption">國家電影中心 大影格</p>
        <div class="line"></div>
        <p class="caption">THIS IS NOT A GHOST STORY</p>
      </div>
    </main>

    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
